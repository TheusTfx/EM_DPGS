<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de Emendas</title>
<style>
:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --border: #cbd5e1;
  --border-light: #e2e8f0;
  --text: #0f172a;
  --text-muted: #475569;
  --text-subtle: #94a3b8;
  --primary: #1e3a8a;
  --primary-hover: #1e40af;
  --primary-light: #dbeafe;
  --success: #166534;
  --success-bg: #dcfce7;
  --warning: #92400e;
  --warning-bg: #fef3c7;
  --info: #1e40af;
  --info-bg: #dbeafe;
  --danger: #991b1b;
  --danger-bg: #fee2e2;
  --neutral: #334155;
  --neutral-bg: #e2e8f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 14px; }

/* HEADER */
.header {
  background: var(--primary);
  color: #fff;
  border-bottom: 2px solid #0f172a;
}
.header-inner {
  max-width: 1280px; margin: 0 auto;
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand { display: flex; flex-direction: column; line-height: 1.2; }
.brand-title { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
.brand-sub { font-size: 12px; color: #bfdbfe; margin-top: 2px; }
.header-actions { display: flex; gap: 8px; }
.header-actions .btn-ghost {
  background: transparent; color: #fff; border-color: rgba(255,255,255,.3);
}
.header-actions .btn-ghost:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.5); }
.header-actions .btn-primary {
  background: #fff; color: var(--primary); border-color: #fff;
}
.header-actions .btn-primary:hover { background: #f1f5f9; }

/* LAYOUT */
.container { max-width: 1280px; margin: 0 auto; padding: 24px; }

/* KPI CARDS */
.kpis {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px; margin-bottom: 20px;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-left: 3px solid var(--primary);
  padding: 14px 18px;
}
.kpi-label {
  font-size: 11px; font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .04em;
  margin-bottom: 6px;
}
.kpi-value { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.kpi-value.small { font-size: 16px; }

/* TOOLBAR */
.toolbar {
  background: var(--surface);
  border: 1px solid var(--border-light);
  padding: 12px 16px;
  margin-bottom: 12px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.search-wrap { flex: 1; min-width: 220px; position: relative; }
.search-wrap svg {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text-subtle); pointer-events: none;
}
.search-wrap input {
  width: 100%; padding: 8px 12px 8px 32px;
  border: 1px solid var(--border);
  background: var(--surface);
  outline: none; transition: border-color .12s;
  color: var(--text);
}
.search-wrap input:focus { border-color: var(--primary); }
.filter-select {
  padding: 8px 10px; min-width: 150px;
  border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  outline: none; cursor: pointer; transition: border-color .12s;
}
.filter-select:focus { border-color: var(--primary); }

/* BUTTONS */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  border: 1px solid transparent;
  font-weight: 500; font-size: 13px;
  transition: background .12s, border-color .12s;
  white-space: nowrap;
  border-radius: 2px;
}
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-ghost { background: transparent; color: var(--text-muted); border-color: var(--border); }
.btn-ghost:hover { background: var(--bg); color: var(--text); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: var(--bg); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon {
  width: 30px; height: 30px; padding: 0;
  border-radius: 2px;
  background: transparent; border: 1px solid transparent;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-muted); transition: all .12s;
}
.btn-icon:hover { background: var(--bg); color: var(--text); border-color: var(--border); }
.btn-icon.danger:hover { background: var(--danger-bg); color: var(--danger); border-color: #fca5a5; }

/* TABLE */
.table-card {
  background: var(--surface);
  border: 1px solid var(--border-light);
  overflow: hidden;
}
.table-header {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border-light);
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; color: var(--text-muted);
  background: #f8fafc;
}
.table-header strong { color: var(--text); font-weight: 600; }
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left;
  padding: 10px 18px;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .04em;
  color: var(--text-muted);
  background: #f8fafc;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
thead th.right { text-align: right; }
tbody tr {
  border-bottom: 1px solid var(--border-light);
  transition: background .1s;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f8fafc; }
tbody td { padding: 12px 18px; vertical-align: middle; }
.cell-main { font-weight: 500; color: var(--text); margin-bottom: 2px; }
.cell-sub { font-size: 12px; color: var(--text-muted); }
.cell-obj { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell-value { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.cell-value small { display: block; font-weight: 400; font-size: 11px; color: var(--text-muted); }
.cell-actions { width: 90px; text-align: right; }
.row-actions { display: flex; gap: 2px; justify-content: flex-end; opacity: 0; transition: opacity .12s; }
tbody tr:hover .row-actions { opacity: 1; }

/* STATUS */
.status {
  display: inline-block; padding: 2px 8px;
  font-size: 11.5px; font-weight: 500;
  border: 1px solid transparent; border-radius: 2px;
}
.status-aguardando { background: var(--neutral-bg); color: var(--neutral); border-color: #cbd5e1; }
.status-empenhado  { background: var(--warning-bg); color: var(--warning); border-color: #fde68a; }
.status-em-execucao { background: var(--info-bg); color: var(--info); border-color: #bfdbfe; }
.status-pago       { background: var(--success-bg); color: var(--success); border-color: #bbf7d0; }
.status-cancelada  { background: var(--danger-bg); color: var(--danger); border-color: #fecaca; }

/* EMPTY STATE */
.empty { padding: 60px 24px; text-align: center; color: var(--text-muted); }
.empty-icon {
  width: 44px; height: 44px; margin: 0 auto 14px;
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-subtle);
}
.empty-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.empty-desc { font-size: 13px; }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(15,23,42,.5);
  z-index: 100;
  display: none;
  align-items: flex-start; justify-content: center;
  padding: 40px 16px;
  overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  width: 100%; max-width: 620px;
}
.modal-header {
  padding: 16px 22px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: #f8fafc;
}
.modal-title { font-size: 15px; font-weight: 600; color: var(--text); }
.modal-body { padding: 22px; }
.modal-footer {
  padding: 14px 22px;
  border-top: 1px solid var(--border);
  background: #f8fafc;
  display: flex; justify-content: flex-end; gap: 8px;
}

/* FORM */
.form-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
}
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label {
  font-size: 12px; font-weight: 500; color: var(--text-muted);
}
.form-group label .req { color: var(--danger); }
.form-group input,
.form-group select,
.form-group textarea {
  padding: 8px 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  outline: none; transition: border-color .12s;
  width: 100%;
  color: var(--text);
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: var(--primary);
}
.form-group textarea { resize: vertical; min-height: 80px; }

/* TOAST */
.toast {
  position: fixed; bottom: 20px; right: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 10px 14px;
  font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 8px;
  z-index: 200;
  transform: translateY(20px); opacity: 0;
  transition: all .2s ease-out;
  pointer-events: none;
  max-width: 340px;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast-success { border-left: 3px solid var(--success); }
.toast-success .toast-icon { color: var(--success); }
.toast-error { border-left: 3px solid var(--danger); }
.toast-error .toast-icon { color: var(--danger); }

/* RESPONSIVE */
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) {
  .container { padding: 16px; }
  .header-inner { padding: 12px 16px; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { padding: 12px; }
  .kpi-value { font-size: 16px; }
  .toolbar { padding: 10px; gap: 8px; }
  .filter-select { min-width: 0; flex: 1; }
  .form-grid { grid-template-columns: 1fr; }
  table { font-size: 13px; }
  thead { display: none; }
  tbody tr { display: block; padding: 12px 0; }
  tbody td { display: block; padding: 4px 16px; border: none; }
  .cell-value, .cell-actions { text-align: left; }
  .row-actions { opacity: 1; justify-content: flex-start; margin-top: 8px; }
  .cell-obj { max-width: none; white-space: normal; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-title">Radar de Emendas</div>
      <div class="brand-sub">Gabinete Deputado Estadual · Rio Grande do Sul</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" onclick="carregarTudo()" title="Recarregar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        Atualizar
      </button>
      <button class="btn btn-primary btn-sm" onclick="abrirModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nova emenda
      </button>
    </div>
  </div>
</header>

<main class="container">
  <section class="kpis">
    <div class="kpi">
      <div class="kpi-label">Total de emendas</div>
      <div class="kpi-value" id="kpi-total">—</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Valor empenhado</div>
      <div class="kpi-value small" id="kpi-empenhado">—</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Valor pago</div>
      <div class="kpi-value small" id="kpi-pago">—</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Em execução</div>
      <div class="kpi-value" id="kpi-execucao">—</div>
    </div>
  </section>

  <section class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="busca" placeholder="Buscar por número, município, objeto ou observação..." oninput="debounceBusca()">
    </div>
    <select class="filter-select" id="filtro-situacao" onchange="carregarEmendas()">
      <option value="">Todas as situações</option>
    </select>
    <select class="filter-select" id="filtro-municipio" onchange="carregarEmendas()">
      <option value="">Todos os municípios</option>
    </select>
    <select class="filter-select" id="filtro-ano" onchange="carregarEmendas()">
      <option value="">Todos os anos</option>
    </select>
  </section>

  <section class="table-card">
    <div class="table-header">
      <span><strong id="contador">0</strong> <span id="contador-label">emendas</span></span>
    </div>
    <div id="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th>Emenda</th>
            <th>Município</th>
            <th>Objeto</th>
            <th class="right">Valores</th>
            <th>Situação</th>
            <th class="right">Ações</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display: none;">
      <div class="empty-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <div class="empty-title">Nenhuma emenda cadastrada</div>
      <div class="empty-desc">Clique em "Nova emenda" para começar o cadastro.</div>
    </div>
  </section>
</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Nova emenda</div>
      <button class="btn-icon" onclick="fecharModal()" aria-label="Fechar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="form-emenda" onsubmit="salvarEmenda(event)">
      <div class="modal-body">
        <input type="hidden" id="f-id">
        <input type="hidden" id="f-versao">
        <div class="form-grid">
          <div class="form-group">
            <label>Número da emenda <span class="req">*</span></label>
            <input type="text" id="f-numero" required placeholder="Ex: 2026-0001">
          </div>
          <div class="form-group">
            <label>Ano <span class="req">*</span></label>
            <input type="number" id="f-ano" required value="2026">
          </div>
          <div class="form-group">
            <label>Município <span class="req">*</span></label>
            <input type="text" id="f-municipio" required placeholder="Ex: Tapejara">
          </div>
          <div class="form-group">
            <label>Situação</label>
            <select id="f-situacao">
              <option>Aguardando</option>
              <option>Empenhado</option>
              <option>Em execução</option>
              <option>Pago</option>
              <option>Cancelada</option>
            </select>
          </div>
          <div class="form-group full">
            <label>Objeto / Descrição</label>
            <input type="text" id="f-objeto" placeholder="Ex: Pavimentação asfáltica - Rua X">
          </div>
          <div class="form-group">
            <label>Valor empenhado (R$)</label>
            <input type="number" step="0.01" id="f-empenhado" placeholder="0,00">
          </div>
          <div class="form-group">
            <label>Valor pago (R$)</label>
            <input type="number" step="0.01" id="f-pago" placeholder="0,00">
          </div>
          <div class="form-group full">
            <label>Observações</label>
            <textarea id="f-observacoes" placeholder="Anotações internas..."></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-salvar">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast">
  <span class="toast-icon">✓</span>
  <span id="toast-msg"></span>
</div>

<script>
let emendasCache = [];
let debounceTimer = null;

function fmtMoney(v) {
  return 'R$ ' + (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function escapeHTML(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function badgeSituacao(s) {
  const cls = (s || 'Aguardando').toLowerCase().replace(/\s+/g, '-').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return `<span class="status status-${cls}">${escapeHTML(s || 'Aguardando')}</span>`;
}
function debounceBusca() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(carregarEmendas, 300);
}

async function carregarEmendas() {
  const q = document.getElementById('busca').value.trim();
  const sit = document.getElementById('filtro-situacao').value;
  const mun = document.getElementById('filtro-municipio').value;
  const ano = document.getElementById('filtro-ano').value;
  const params = new URLSearchParams();
  if (q) params.append('q', q);
  if (sit) params.append('situacao', sit);
  if (mun) params.append('municipio', mun);
  if (ano) params.append('ano', ano);

  try {
    const res = await fetch('/api/emendas?' + params);
    if (!res.ok) throw new Error('Erro ' + res.status);
    emendasCache = await res.json();
    renderTabela();
    atualizarKPIs();
  } catch (err) {
    console.error(err);
    toast('Erro ao carregar emendas', 'error');
  }
}

function renderTabela() {
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  const wrap = document.getElementById('tabela-wrap');
  const cont = document.getElementById('contador');
  const contLabel = document.getElementById('contador-label');

  cont.textContent = emendasCache.length;
  contLabel.textContent = emendasCache.length === 1 ? 'emenda' : 'emendas';

  if (emendasCache.length === 0) {
    wrap.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  wrap.style.display = 'block';
  empty.style.display = 'none';
  tbody.innerHTML = '';

  emendasCache.forEach(e => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="cell-main">${escapeHTML(e.numero_emenda)}</div>
        <div class="cell-sub">${escapeHTML(e.ano)}</div>
      </td>
      <td><div class="cell-main">${escapeHTML(e.municipio)}</div></td>
      <td class="cell-obj"><div class="cell-main">${escapeHTML(e.objeto || '—')}</div></td>
      <td class="cell-value">${fmtMoney(e.valor_empenhado)}<small>Pago: ${fmtMoney(e.valor_pago)}</small></td>
      <td>${badgeSituacao(e.situacao)}</td>
      <td class="cell-actions">
        <div class="row-actions">
          <button class="btn-icon" onclick="abrirModal(${e.id})" title="Editar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn-icon danger" onclick="excluirEmenda(${e.id})" title="Excluir">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
          </button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function atualizarKPIs() {
  const total = emendasCache.length;
  const empenhado = emendasCache.reduce((s, e) => s + (Number(e.valor_empenhado) || 0), 0);
  const pago = emendasCache.reduce((s, e) => s + (Number(e.valor_pago) || 0), 0);
  const execucao = emendasCache.filter(e => (e.situacao || '').toLowerCase() === 'em execução').length;
  document.getElementById('kpi-total').textContent = total;
  document.getElementById('kpi-empenhado').textContent = fmtMoney(empenhado);
  document.getElementById('kpi-pago').textContent = fmtMoney(pago);
  document.getElementById('kpi-execucao').textContent = execucao;
}

async function carregarFiltros() {
  try {
    const res = await fetch('/api/filtros');
    if (!res.ok) return;
    const f = await res.json();
    const sitSel = document.getElementById('filtro-situacao');
    const munSel = document.getElementById('filtro-municipio');
    const anoSel = document.getElementById('filtro-ano');
    sitSel.innerHTML = '<option value="">Todas as situações</option>' +
      f.situacoes.map(s => `<option>${escapeHTML(s)}</option>`).join('');
    munSel.innerHTML = '<option value="">Todos os municípios</option>' +
      f.municipios.map(m => `<option>${escapeHTML(m)}</option>`).join('');
    anoSel.innerHTML = '<option value="">Todos os anos</option>' +
      f.anos.map(a => `<option>${a}</option>`).join('');
  } catch (err) { console.error(err); }
}

function carregarTudo() {
  carregarEmendas();
  carregarFiltros();
}

function abrirModal(id) {
  document.getElementById('form-emenda').reset();
  document.getElementById('f-id').value = '';
  document.getElementById('f-versao').value = '';
  document.getElementById('f-ano').value = new Date().getFullYear();
  document.getElementById('modal-title').textContent = id ? 'Editar emenda' : 'Nova emenda';

  if (id) {
    const e = emendasCache.find(x => x.id === id);
    if (e) {
      document.getElementById('f-id').value = e.id;
      document.getElementById('f-versao').value = e.versao || 1;
      document.getElementById('f-numero').value = e.numero_emenda || '';
      document.getElementById('f-ano').value = e.ano || '';
      document.getElementById('f-municipio').value = e.municipio || '';
      document.getElementById('f-situacao').value = e.situacao || 'Aguardando';
      document.getElementById('f-objeto').value = e.objeto || '';
      document.getElementById('f-empenhado').value = e.valor_empenhado || '';
      document.getElementById('f-pago').value = e.valor_pago || '';
      document.getElementById('f-observacoes').value = e.observacoes || '';
    }
  }
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-numero').focus(), 100);
}

function fecharModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) fecharModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') fecharModal();
});

async function salvarEmenda(ev) {
  ev.preventDefault();
  const id = document.getElementById('f-id').value;
  const dados = {
    numero_emenda: document.getElementById('f-numero').value.trim(),
    ano: parseInt(document.getElementById('f-ano').value),
    municipio: document.getElementById('f-municipio').value.trim(),
    objeto: document.getElementById('f-objeto').value.trim(),
    situacao: document.getElementById('f-situacao').value,
    valor_empenhado: parseFloat(document.getElementById('f-empenhado').value) || 0,
    valor_pago: parseFloat(document.getElementById('f-pago').value) || 0,
    observacoes: document.getElementById('f-observacoes').value.trim(),
  };
  if (id) dados.versao = parseInt(document.getElementById('f-versao').value) || 1;

  const btn = document.getElementById('btn-salvar');
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  try {
    const url = id ? `/api/emendas/${id}` : '/api/emendas';
    const method = id ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method, headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dados)
    });
    if (res.status === 409) {
      toast('Esta emenda foi alterada por outro usuário. Recarregue.', 'error');
      return;
    }
    if (!res.ok) throw new Error('Erro ao salvar');
    fecharModal();
    toast(id ? 'Emenda atualizada' : 'Emenda criada', 'success');
    carregarTudo();
  } catch (err) {
    console.error(err);
    toast('Erro ao salvar emenda', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salvar';
  }
}

async function excluirEmenda(id) {
  if (!confirm('Confirma a exclusão desta emenda?')) return;
  try {
    const res = await fetch(`/api/emendas/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error();
    toast('Emenda excluída', 'success');
    carregarTudo();
  } catch (err) {
    toast('Erro ao excluir', 'error');
  }
}

function toast(msg, tipo) {
  const el = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  el.className = 'toast show toast-' + tipo;
  el.querySelector('.toast-icon').textContent = tipo === 'success' ? '✓' : '✕';
  setTimeout(() => el.classList.remove('show'), 3000);
}

document.addEventListener('DOMContentLoaded', carregarTudo);
</script>
</body>
</html>
