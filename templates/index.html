let regiaoEditadaManualmente = false;

// Quando o usuário edita a região manualmente, marca o flag

  regiaoEditadaManualmente = true;
});

// Quando o usuário digita o município

    _inputRegiao.value = mapaRegioes[valor] || '';
  }
});
